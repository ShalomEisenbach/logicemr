<template>
  <c-emr-chart-panel title="Vitals">
    <template lwc:if={errorMessage}>
      <div class="slds-text-color_error slds-m-bottom_small" role="alert">
        {errorMessage}
      </div>
    </template>
    <template lwc:if={isLoading}>
      <p class="slds-text-body_small slds-m-bottom_small" role="status">
        Loading recorded vitals…
      </p>
    </template>
    <template lwc:if={loadFailed}>
      <lightning-button
        label="Retry loading vitals"
        onclick={handleReload}
      ></lightning-button>
    </template>
    <div class="slds-grid slds-gutters_x-small slds-wrap">
      <template for:each={vitals} for:item="vital">
        <div
          key={vital.key}
          class="slds-col slds-size_1-of-2 slds-m-bottom_x-small"
        >
          <lightning-input
            type="number"
            label={vital.label}
            value={vital.value}
            min={vital.min}
            max={vital.max}
            step={vital.step}
            disabled={vital.disabled}
            field-level-help={vital.help}
            data-key={vital.key}
            message-when-range-overflow={vital.rangeMessage}
            message-when-range-underflow={vital.rangeMessage}
            onchange={handleChange}
            oncommit={handleChange}
          ></lightning-input>
          <template lwc:if={vital.unitWarning}>
            <p class="slds-text-body_small slds-m-top_xx-small">
              {vital.unitWarning}
            </p>
          </template>
        </div>
      </template>
    </div>
  </c-emr-chart-panel>
</template>
