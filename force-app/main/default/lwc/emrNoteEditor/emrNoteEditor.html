<template>
    <c-emr-chart-panel title="Notes">
        <lightning-button
            slot="actions"
            label="New note"
            variant="neutral"
            disabled={isLoading}
            onclick={handleOpenEditor}
        ></lightning-button>
        <template lwc:if={errorMessage}>
            <div class="slds-text-color_error slds-m-bottom_small" role="alert">{errorMessage}</div>
        </template>

        <template lwc:if={hasNotes}>
            <template for:each={notes} for:item="note">
                <article key={note.id} class="note-card">
                    <div class="note-card-header">
                        <p class="slds-text-body_regular">
                            <c-emr-record-link
                                record-id={note.id}
                                object-api-name={clinicalNoteObjectApiName}
                                label={note.summaryLabel}
                            ></c-emr-record-link>
                        </p>
                        <lightning-badge label={note.status}></lightning-badge>
                    </div>
                    <template lwc:if={note.signedDate}>
                        <p class="slds-text-body_small slds-text-color_weak slds-m-top_xx-small">
                            Signed
                            <lightning-formatted-date-time
                                value={note.signedDate}
                                year="numeric"
                                month="short"
                                day="2-digit"
                                hour="2-digit"
                                minute="2-digit"
                            ></lightning-formatted-date-time>
                        </p>
                    </template>
                    <template lwc:if={note.canEdit}>
                        <lightning-combobox
                            data-note-id={note.id}
                            name="noteType"
                            label="Note type"
                            value={note.noteType}
                            options={noteTypeOptions}
                            class="slds-m-top_small"
                            onchange={handleInlineNoteTypeChange}
                        ></lightning-combobox>
                        <lightning-textarea
                            data-note-id={note.id}
                            class="note-inline-body slds-m-top_x-small"
                            name="noteBody"
                            label="Note"
                            value={note.body}
                            max-length="32768"
                            onchange={handleInlineBodyChange}
                            oninput={handleInlineBodyChange}
                        ></lightning-textarea>
                        <div class="note-card-actions">
                            <lightning-button
                                label="Save as Draft"
                                variant="neutral"
                                data-note-id={note.id}
                                disabled={isBusy}
                                onclick={handleInlineSaveDraft}
                            ></lightning-button>
                            <lightning-button
                                label="Sign"
                                variant="brand"
                                data-note-id={note.id}
                                disabled={isBusy}
                                onclick={handleInlineSign}
                            ></lightning-button>
                        </div>
                    </template>
                    <template lwc:else>
                        <template lwc:if={note.hasBody}>
                            <div class="note-preview">{note.body}</div>
                        </template>
                    </template>
                </article>
            </template>
        </template>
        <template lwc:else>
            <p class="slds-text-body_regular">No notes for this encounter.</p>
        </template>

        <template lwc:if={showEditor}>
            <c-emr-modal title="Clinical note" size="large" onclose={handleCloseEditor}>
                <template lwc:if={errorMessage}>
                    <div class="slds-text-color_error slds-m-bottom_small" role="alert">{errorMessage}</div>
                </template>
                <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-end slds-wrap slds-m-bottom_small">
                    <div class="slds-col slds-grow">
                        <lightning-combobox
                            name="noteType"
                            label="Note type"
                            value={noteType}
                            options={noteTypeOptions}
                            disabled={isLocked}
                            onchange={handleNoteTypeChange}
                        ></lightning-combobox>
                    </div>
                    <div class="slds-col slds-no-flex slds-m-left_small slds-m-top_small">
                        <lightning-badge label={status}></lightning-badge>
                        <template lwc:if={signedDate}>
                            <span class="slds-m-left_x-small slds-text-body_small slds-text-color_weak">
                                <lightning-formatted-date-time
                                    value={signedDate}
                                    year="numeric"
                                    month="short"
                                    day="2-digit"
                                    hour="2-digit"
                                    minute="2-digit"
                                ></lightning-formatted-date-time>
                            </span>
                        </template>
                    </div>
                </div>

                <div class="slds-grid slds-gutters slds-wrap">
                    <div class="slds-col slds-size_1-of-1 slds-large-size_2-of-3">
                        <lightning-textarea
                            data-id="note-body"
                            class="note-body"
                            name="noteBody"
                            label="Note"
                            value={body}
                            max-length="32768"
                            disabled={isLocked}
                            onchange={handleBodyChange}
                            oninput={handleBodyChange}
                        ></lightning-textarea>
                    </div>

                    <div class="slds-col slds-size_1-of-1 slds-large-size_1-of-3 slds-m-top_small">
                        <div class="template-panel">
                            <h3 class="slds-text-title_caps">Templates</h3>
                            <p class="slds-text-body_small slds-text-color_weak slds-m-bottom_small">
                                Click a template to insert it, or type its shortcut (for example .ros).
                            </p>
                            <template lwc:if={hasTemplates}>
                                <lightning-input
                                    type="search"
                                    label="Search templates"
                                    placeholder="Name or shortcut"
                                    value={templateSearch}
                                    class="slds-m-bottom_small"
                                    onchange={handleTemplateSearch}
                                    onkeyup={handleTemplateSearch}
                                ></lightning-input>
                                <template lwc:if={hasMatchingTemplates}>
                                    <div class="template-list-wrap">
                                        <template for:each={templateGroups} for:item="group">
                                            <section key={group.key} class="slds-m-bottom_small">
                                                <h4 class="slds-text-title_caps slds-m-bottom_xx-small">{group.category}</h4>
                                                <ul class="template-list">
                                                    <template for:each={group.templates} for:item="item">
                                                        <li key={item.id}>
                                                            <button
                                                                class="template-button"
                                                                type="button"
                                                                data-template-id={item.id}
                                                                disabled={isLocked}
                                                                onclick={handleInsertTemplate}
                                                            >
                                                                <span class="slds-truncate">{item.name}</span>
                                                                <template lwc:if={item.shortcutLabel}>
                                                                    <span class="shortcut">{item.shortcutLabel}</span>
                                                                </template>
                                                            </button>
                                                        </li>
                                                    </template>
                                                </ul>
                                            </section>
                                        </template>
                                    </div>
                                </template>
                                <template lwc:else>
                                    <p class="slds-text-body_regular">{emptyTemplatesMessage}</p>
                                </template>
                            </template>
                            <template lwc:else>
                                <p class="slds-text-body_regular">{emptyTemplatesMessage}</p>
                            </template>
                        </div>
                    </div>
                </div>

                <div slot="footer">
                    <lightning-button
                        label="Cancel"
                        variant="neutral"
                        onclick={handleCloseEditor}
                        class="slds-m-right_small"
                    ></lightning-button>
                    <lightning-button
                        label="Save as Draft"
                        variant="neutral"
                        disabled={actionsDisabled}
                        onclick={handleSaveDraft}
                        class="slds-m-right_small"
                    ></lightning-button>
                    <lightning-button
                        label="Sign"
                        variant="brand"
                        disabled={actionsDisabled}
                        onclick={handleSign}
                    ></lightning-button>
                </div>
            </c-emr-modal>
        </template>
    </c-emr-chart-panel>
</template>
