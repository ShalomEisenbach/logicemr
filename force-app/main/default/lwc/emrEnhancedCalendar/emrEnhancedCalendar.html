<template>
    <lightning-card title="Enhanced calendar" icon-name="standard:event">
        <div class={shellClass}>
            <div class={toolbarClass}>
                <template lwc:if={showFilters}>
                    <div class="toolbar-filters">
                        <lightning-record-picker
                            label="Provider"
                            placeholder="Search practitioners"
                            object-api-name={practitionerObjectApiName}
                            value={practitionerId}
                            onchange={handlePractitionerChange}
                        ></lightning-record-picker>
                        <lightning-combobox
                            name="location"
                            label="Location"
                            value={locationKey}
                            options={locationOptions}
                            onchange={handleLocationChange}
                        ></lightning-combobox>
                    </div>
                </template>
                <div class="toolbar-nav">
                    <lightning-radio-group
                        name="viewMode"
                        label="View"
                        options={viewOptions}
                        value={viewMode}
                        type="button"
                        onchange={handleViewChange}
                    ></lightning-radio-group>
                    <div class="nav-row">
                        <lightning-button-icon
                            icon-name="utility:chevronleft"
                            alternative-text="Previous"
                            title="Previous"
                            disabled={isBusy}
                            onclick={handlePrev}
                        ></lightning-button-icon>
                        <lightning-button
                            label="Today"
                            variant="neutral"
                            disabled={isBusy}
                            onclick={handleToday}
                        ></lightning-button>
                        <lightning-button-icon
                            icon-name="utility:chevronright"
                            alternative-text="Next"
                            title="Next"
                            disabled={isBusy}
                            onclick={handleNext}
                        ></lightning-button-icon>
                        <lightning-input
                            name="selectedDate"
                            label="Date"
                            type="date"
                            value={selectedDate}
                            variant="label-hidden"
                            onchange={handleDateChange}
                        ></lightning-input>
                        <lightning-button
                            label="Refresh"
                            variant="neutral"
                            disabled={isBusy}
                            onclick={handleRefresh}
                        ></lightning-button>
                    </div>
                    <p class="range-label" aria-live="polite">{rangeLabel}</p>
                </div>
            </div>

            <template lwc:if={showNextAvailability}>
                <div class="next-availability">
                    <h3 class="next-availability-title">Next availability</h3>
                    <ul class="next-list">
                        <template for:each={nextAvailabilityRows} for:item="row">
                            <li key={row.key}>
                                <button
                                    type="button"
                                    class={row.className}
                                    data-practitioner-id={row.practitionerId}
                                    data-day-key={row.dayKey}
                                    onclick={handleNextAvailabilityClick}
                                >
                                    <span class="next-name">{row.practitionerName}</span>
                                    <span class="next-when">{row.when}</span>
                                    <template lwc:if={row.meta}>
                                        <span class="next-meta">{row.meta}</span>
                                    </template>
                                </button>
                            </li>
                        </template>
                    </ul>
                </div>
            </template>

            <template lwc:if={showManageAvailability}>
                <div class="manage-row">
                    <lightning-input
                        type="toggle"
                        label={manageToggleLabel}
                        checked={manageAvailability}
                        disabled={isManageDisabled}
                        onchange={handleManageToggle}
                    ></lightning-input>
                    <template lwc:if={showPaintMode}>
                        <lightning-radio-group
                            name="paintMode"
                            label="Paint mode"
                            options={paintModeOptions}
                            value={paintMode}
                            type="button"
                            variant="label-hidden"
                            onchange={handlePaintModeChange}
                        ></lightning-radio-group>
                    </template>
                    <template lwc:if={manageHint}>
                        <p class="manage-hint" role="status">{manageHint}</p>
                    </template>
                </div>
            </template>

            <template lwc:if={errorMessage}>
                <div class="slds-text-color_error slds-m-top_small" role="alert">{errorMessage}</div>
            </template>
            <template lwc:if={isBusy}>
                <lightning-spinner alternative-text="Updating calendar" size="small"></lightning-spinner>
            </template>

            <template lwc:if={hasMoreSlots}>
                <p class="slds-text-body_small slds-m-top_small" role="status">
                    Showing the first 2000 slots. Narrow the provider, location, or date range to see more.
                </p>
            </template>

            <template lwc:if={showEmptySlots}>
                <div class="empty-state">
                    <p>No availability in the selected range.</p>
                    <p class="empty-state-hint">
                        Set weekly hours in Schedule management, or select a provider and turn on Manage availability to
                        paint Free or Blocked slots.
                    </p>
                </div>
            </template>
            <template lwc:elseif={showGrid}>
                <div class="legend" aria-hidden="true">
                    <span class="legend-item legend-item_free">Free</span>
                    <span class="legend-item legend-item_booked">Booked</span>
                    <span class="legend-item legend-item_arrived">Arrived</span>
                    <span class="legend-item legend-item_blocked">Blocked</span>
                    <span class="legend-item legend-item_noshow">No Show</span>
                    <span class="legend-item legend-item_cancelled">Cancelled</span>
                </div>
                <div class="grid-scroll">
                    <div class={gridClass}>
                        <div class="time-gutter">
                            <div class="time-gutter-header"></div>
                            <template for:each={timeLabels} for:item="tick">
                                <div key={tick.key} class={tick.className} style={tick.style}>{tick.label}</div>
                            </template>
                        </div>
                        <template for:each={dayColumns} for:item="day">
                            <div key={day.key} class="day-col">
                                <div class={day.headerClass}>
                                    <span class="day-weekday">{day.weekday}</span>
                                    <span class="day-date">{day.dateLabel}</span>
                                </div>
                                <div
                                    class="day-body"
                                    style={day.bodyStyle}
                                    data-day-key={day.key}
                                    onpointerdown={handleDayPointerDown}
                                    onpointermove={handleDayPointerMove}
                                    onpointerup={handleDayPointerUp}
                                >
                                    <template for:each={day.slots} for:item="slot">
                                        <button
                                            key={slot.id}
                                            type="button"
                                            class={slot.className}
                                            style={slot.style}
                                            title={slot.title}
                                            data-slot-id={slot.id}
                                            onclick={handleSlotClick}
                                        >
                                            <template lwc:if={slot.label}>
                                                <span class="slot-label">{slot.label}</span>
                                            </template>
                                        </button>
                                    </template>
                                    <template for:each={day.blocks} for:item="block">
                                        <div
                                            key={block.id}
                                            class={block.className}
                                            style={block.style}
                                            title={block.title}
                                            data-appointment-id={block.id}
                                            data-slot-id={block.slotId}
                                            onpointerdown={handleBlockPointerDown}
                                            onpointermove={handleBlockPointerMove}
                                            onpointerup={handleBlockPointerUp}
                                        >
                                            <span class="block-label">{block.label}</span>
                                            <span class="block-meta">{block.meta}</span>
                                        </div>
                                    </template>
                                    <template lwc:if={day.paintStyle}>
                                        <div class={day.paintClass} style={day.paintStyle}></div>
                                    </template>
                                    <template lwc:if={day.showNow}>
                                        <div class="now-line" style={day.nowStyle} aria-hidden="true"></div>
                                    </template>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>
            </template>

            <template lwc:if={bookingPopover}>
                <div
                    class="popover"
                    role="dialog"
                    aria-label="Book appointment"
                    style={bookingPopover.style}
                    onpointerdown={handlePopoverPointerDown}
                >
                    <p class="popover-title">Book appointment</p>
                    <p class="popover-meta">{bookingPopover.when}</p>
                    <template lwc:if={showBookingPatientPicker}>
                        <lightning-record-picker
                            label="Patient"
                            placeholder="Search patients"
                            object-api-name={patientObjectApiName}
                            value={bookingPatientId}
                            required
                            onchange={handleBookingPatient}
                        ></lightning-record-picker>
                        <c-emr-patient-registration
                            button-variant="base"
                            class="slds-m-top_x-small"
                            onpatientcreated={handlePatientCreated}
                        ></c-emr-patient-registration>
                    </template>
                    <lightning-combobox
                        name="appointmentType"
                        label="Appointment type"
                        value={bookingType}
                        options={typeOptions}
                        required
                        class="slds-m-top_small"
                        onchange={handleBookingType}
                    ></lightning-combobox>
                    <lightning-input
                        name="reason"
                        label="Reason"
                        value={bookingReason}
                        maxlength="255"
                        class="slds-m-top_small"
                        onchange={handleBookingReason}
                    ></lightning-input>
                    <div class="popover-actions">
                        <lightning-button label="Cancel" onclick={handleCloseBooking}></lightning-button>
                        <lightning-button
                            label="Book"
                            variant="brand"
                            disabled={isBookDisabled}
                            onclick={handleBookSubmit}
                        ></lightning-button>
                    </div>
                </div>
            </template>

            <template lwc:if={actionPopover}>
                <div
                    class="popover"
                    role="dialog"
                    aria-label="Appointment actions"
                    style={actionPopover.style}
                    onpointerdown={handlePopoverPointerDown}
                >
                    <p class="popover-title">{selectedActionTitle}</p>
                    <p class="popover-meta">{actionPopover.when}</p>
                    <p class="popover-meta">{selectedAction.status}</p>
                    <template lwc:if={selectedAction.appointmentType}>
                        <p class="popover-meta">Type: {selectedAction.appointmentType}</p>
                    </template>
                    <template lwc:if={selectedAction.reason}>
                        <p class="popover-meta">Reason: {selectedAction.reason}</p>
                    </template>
                    <div class="popover-actions">
                        <template lwc:if={canArriveSelected}>
                            <lightning-button
                                label="Arrive"
                                variant="brand"
                                disabled={isBusy}
                                onclick={handleArrive}
                            ></lightning-button>
                        </template>
                        <template lwc:if={canNotifySelected}>
                            <lightning-button
                                label="Send Confirmation"
                                disabled={isBusy}
                                onclick={handleSendConfirmation}
                            ></lightning-button>
                            <lightning-button
                                label="Send Reminder"
                                disabled={isBusy}
                                onclick={handleSendReminder}
                            ></lightning-button>
                        </template>
                        <template lwc:if={canPrintSelected}>
                            <lightning-button
                                label="Print"
                                disabled={isBusy}
                                onclick={handlePrintAppointment}
                            ></lightning-button>
                        </template>
                        <template lwc:if={canCancelSelected}>
                            <lightning-button
                                label="Cancel"
                                disabled={isBusy}
                                onclick={handleCancelAppointment}
                            ></lightning-button>
                        </template>
                        <template lwc:if={canNoShowSelected}>
                            <lightning-button
                                label="No Show"
                                disabled={isBusy}
                                onclick={handleNoShow}
                            ></lightning-button>
                        </template>
                        <template lwc:if={canOpenChart}>
                            <lightning-button
                                label={openChartLabel}
                                disabled={isBusy}
                                onclick={handleOpenChart}
                            ></lightning-button>
                        </template>
                        <lightning-button label="Close" onclick={handleCloseActions}></lightning-button>
                    </div>
                </div>
            </template>
            <template lwc:if={showNotifyModal}>
                <c-emr-modal title={notifyModalTitle} size="small" onclose={handleCloseNotify}>
                    <c-emr-appointment-notify
                        appointment-id={notifyAppointmentId}
                        message-type={notifyMessageType}
                        onsent={handleNotifySent}
                        oncancel={handleCloseNotify}
                    ></c-emr-appointment-notify>
                </c-emr-modal>
            </template>
            <template lwc:if={showPrintModal}>
                <c-emr-modal title="Print appointment" size="medium" onclose={handleClosePrint}>
                    <c-emr-appointment-print
                        appointment-id={printAppointmentId}
                        onprinted={handleClosePrint}
                    ></c-emr-appointment-print>
                    <div slot="footer">
                        <lightning-button label="Close" onclick={handleClosePrint}></lightning-button>
                    </div>
                </c-emr-modal>
            </template>
        </div>
    </lightning-card>
</template>
