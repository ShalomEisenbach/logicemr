<template>
  <section class="submission-panel" aria-label="Claim submissions">
    <div class="heading">
      <div>
        <h3 class="slds-text-title_caps">837P submissions</h3>
        <p class="slds-text-body_small">
          Submission confirms clearinghouse handoff. The 277CA timeline shows
          whether the clearinghouse or payer received, accepted, or rejected the
          claim.
        </p>
      </div>
      <div>
        <lightning-button-icon
          icon-name="utility:refresh"
          alternative-text="Refresh submissions"
          title="Refresh submissions"
          disabled={isWorking}
          onclick={handleRefresh}
        ></lightning-button-icon>
        <lightning-button
          class="slds-m-left_x-small"
          variant="brand"
          label="Submit 837P"
          disabled={submitDisabled}
          onclick={handleSubmit}
        ></lightning-button>
      </div>
    </div>

    <template lwc:if={errorMessage}>
      <div class="slds-text-color_error slds-m-top_small" role="alert">
        {errorMessage}
      </div>
    </template>
    <template lwc:if={hasSubmissions}>
      <div class="submission-list slds-m-top_small">
        <template for:each={submissions} for:item="submission">
          <article key={submission.Id} class="submission-row">
            <div>
              <span class={submission.statusClass}>{submission.Status__c}</span>
              <strong class="slds-m-left_x-small">{submission.Name}</strong>
              <p class="detail">
                PCN {submission.Patient_Control_Number__c} ·
                {submission.Provider_Used__c}
              </p>
              <template lwc:if={submission.Correlation_Id__c}>
                <p class="detail">Correlation {submission.Correlation_Id__c}</p>
              </template>
              <template lwc:if={submission.Submitted_At__c}>
                <p class="detail acknowledgment-summary">
                  277CA
                  <span class={submission.acknowledgmentStatusClass}
                    >{submission.acknowledgmentStatus}</span
                  >
                </p>
              </template>
              <template lwc:if={submission.Payer_Claim_Control_Number__c}>
                <p class="detail">
                  Payer claim {submission.Payer_Claim_Control_Number__c}
                </p>
              </template>
              <template lwc:if={submission.Acknowledgment_Message__c}>
                <p class="acknowledgment-message">
                  {submission.Acknowledgment_Message__c}
                </p>
              </template>
              <template lwc:if={submission.Error_Message__c}>
                <p class="error-detail">{submission.Error_Message__c}</p>
              </template>
              <template lwc:if={submission.hasAcknowledgments}>
                <ol class="acknowledgment-list" aria-label="277CA timeline">
                  <template
                    for:each={submission.acknowledgments}
                    for:item="acknowledgment"
                  >
                    <li key={acknowledgment.Id} class="acknowledgment-row">
                      <span class={acknowledgment.statusClass}
                        >{acknowledgment.Status__c}</span
                      >
                      <span>{acknowledgment.senderLabel}</span>
                      <template lwc:if={acknowledgment.Effective_Date__c}>
                        <lightning-formatted-date-time
                          value={acknowledgment.Effective_Date__c}
                          year="numeric"
                          month="short"
                          day="2-digit"
                          time-zone="UTC"
                        ></lightning-formatted-date-time>
                      </template>
                      <template lwc:if={acknowledgment.Status_Codes__c}>
                        <span class="detail"
                          >{acknowledgment.Status_Codes__c}</span
                        >
                      </template>
                      <template lwc:if={acknowledgment.Message__c}>
                        <p>{acknowledgment.Message__c}</p>
                      </template>
                    </li>
                  </template>
                </ol>
              </template>
            </div>
            <div class="attempt">
              <span>Attempt {submission.Attempt_Number__c}</span>
              <template lwc:if={submission.canRetry}>
                <lightning-button
                  class="slds-m-left_small"
                  label={submission.retryLabel}
                  data-id={submission.Id}
                  disabled={isWorking}
                  onclick={handleRetry}
                ></lightning-button>
              </template>
              <template lwc:if={submission.canReopenRejected}>
                <lightning-button
                  class="slds-m-left_small"
                  variant="destructive-text"
                  label="Reopen rejected claim"
                  data-id={submission.Id}
                  disabled={isWorking}
                  onclick={handleReopenRejected}
                ></lightning-button>
              </template>
            </div>
          </article>
        </template>
      </div>
    </template>
    <template lwc:else>
      <p class="slds-text-body_small slds-m-top_small">
        No claim submissions yet.
      </p>
    </template>
  </section>
</template>
