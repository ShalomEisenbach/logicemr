<template>
    <lightning-card title="Schedule management" icon-name="standard:event">
        <div class="slds-p-horizontal_medium slds-p-bottom_medium">
            <p class="slds-text-body_small slds-text-color_weak slds-m-bottom_small">
                Set weekly hours for a provider, generate slots through the planning horizon, and mark time off.
            </p>

            <template lwc:if={errorMessage}>
                <div class="slds-text-color_error slds-m-bottom_small" role="alert">{errorMessage}</div>
            </template>
            <template lwc:if={isBusy}>
                <lightning-spinner alternative-text="Working on schedule" size="small"></lightning-spinner>
            </template>

            <section class="section">
                <h2 class="slds-text-heading_small slds-m-bottom_small">Schedule</h2>
                <div class="slds-grid slds-gutters slds-wrap">
                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                        <template lwc:if={isPractitionerRecordPage}>
                            <p class="slds-form-element__label">Provider</p>
                            <c-emr-record-link
                                record-id={practitionerId}
                                object-api-name={practitionerObjectApiName}
                                label="Current provider"
                            ></c-emr-record-link>
                        </template>
                        <template lwc:else>
                            <lightning-record-picker
                                label="Provider"
                                placeholder="Search practitioners"
                                object-api-name={practitionerObjectApiName}
                                value={practitionerId}
                                required
                                onchange={handlePractitionerChange}
                            ></lightning-record-picker>
                        </template>
                    </div>
                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                        <template lwc:if={hasExistingSchedules}>
                            <lightning-combobox
                                name="schedule"
                                label="Schedule"
                                value={selectedScheduleKey}
                                options={scheduleOptions}
                                onchange={handleScheduleSelect}
                            ></lightning-combobox>
                        </template>
                    </div>
                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                        <lightning-input
                            name="locationName"
                            label="Location"
                            value={locationName}
                            onchange={handleLocationChange}
                        ></lightning-input>
                    </div>
                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                        <lightning-input
                            name="slotDurationMinutes"
                            label="Slot duration (minutes)"
                            type="number"
                            min="1"
                            max="1440"
                            value={slotDurationMinutes}
                            required
                            onchange={handleDurationChange}
                        ></lightning-input>
                    </div>
                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                        <lightning-input
                            name="planningHorizonStart"
                            label="Planning horizon start"
                            type="date"
                            value={planningHorizonStart}
                            onchange={handleHorizonStartChange}
                        ></lightning-input>
                    </div>
                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                        <lightning-input
                            name="planningHorizonEnd"
                            label="Planning horizon end"
                            type="date"
                            value={planningHorizonEnd}
                            onchange={handleHorizonEndChange}
                        ></lightning-input>
                    </div>
                    <div class="slds-col slds-size_1-of-1">
                        <lightning-input
                            name="active"
                            label="Active"
                            type="checkbox"
                            checked={active}
                            onchange={handleActiveChange}
                        ></lightning-input>
                    </div>
                </div>
                <template lwc:if={hasSelectedSchedule}>
                    <p class="slds-text-body_small slds-m-top_x-small">
                        Selected
                        <c-emr-record-link
                            record-id={selectedScheduleId}
                            object-api-name={scheduleObjectApiName}
                            label={scheduleName}
                        ></c-emr-record-link>
                    </p>
                </template>
            </section>

            <section class="section">
                <h2 class="slds-text-heading_small slds-m-bottom_small">Weekly hours</h2>
                <p class="slds-text-body_small slds-text-color_weak slds-m-bottom_small">
                    Add one or more windows per day. A lunch break is simply a gap between two windows.
                </p>
                <div class="slds-m-bottom_small">
                    <lightning-button
                        label="Copy weekdays"
                        variant="neutral"
                        disabled={isBusy}
                        onclick={handleCopyWeekdays}
                    ></lightning-button>
                </div>
                <template for:each={dayRows} for:item="day">
                    <div key={day.key} class="day-row">
                        <div class="day-label">{day.label}</div>
                        <div class="day-windows">
                            <template for:each={day.windows} for:item="window">
                                <div key={window.key} class="window-row">
                                    <lightning-input
                                        type="time"
                                        label="Start"
                                        data-day={day.value}
                                        data-window-id={window.id}
                                        data-field="startTime"
                                        value={window.startTime}
                                        variant="label-hidden"
                                        onchange={handleWindowChange}
                                    ></lightning-input>
                                    <span class="window-sep">to</span>
                                    <lightning-input
                                        type="time"
                                        label="End"
                                        data-day={day.value}
                                        data-window-id={window.id}
                                        data-field="endTime"
                                        value={window.endTime}
                                        variant="label-hidden"
                                        onchange={handleWindowChange}
                                    ></lightning-input>
                                    <lightning-button-icon
                                        icon-name="utility:delete"
                                        alternative-text="Remove window"
                                        title="Remove window"
                                        data-day={day.value}
                                        data-window-id={window.id}
                                        onclick={handleRemoveWindow}
                                    ></lightning-button-icon>
                                </div>
                            </template>
                            <lightning-button
                                label="Add window"
                                variant="base"
                                data-day={day.value}
                                onclick={handleAddWindow}
                            ></lightning-button>
                        </div>
                    </div>
                </template>
                <template lwc:if={hasPreview}>
                    <p class="slds-text-body_regular slds-m-top_small" role="status">{previewSummary}</p>
                </template>
                <div class="slds-m-top_small slds-grid slds-wrap">
                    <lightning-button
                        label={saveGenerateLabel}
                        variant="brand"
                        disabled={isSaveGenerateDisabled}
                        onclick={handleSaveAndGenerate}
                    ></lightning-button>
                </div>
            </section>

            <section class="section">
                <h2 class="slds-text-heading_small slds-m-bottom_small">Time off</h2>
                <template lwc:if={hasSelectedSchedule}>
                    <div class="slds-grid slds-gutters slds-wrap">
                        <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                            <lightning-input
                                name="timeOffStartDate"
                                label="Start date"
                                type="date"
                                value={timeOffStartDate}
                                required
                                onchange={handleTimeOffStartDateChange}
                            ></lightning-input>
                        </div>
                        <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                            <lightning-input
                                name="timeOffEndDate"
                                label="End date"
                                type="date"
                                value={timeOffEndDate}
                                required
                                onchange={handleTimeOffEndDateChange}
                            ></lightning-input>
                        </div>
                        <div class="slds-col slds-size_1-of-1">
                            <lightning-input
                                name="timeOffAllDay"
                                label="All day"
                                type="checkbox"
                                checked={timeOffAllDay}
                                onchange={handleTimeOffAllDayChange}
                            ></lightning-input>
                        </div>
                        <template lwc:if={showTimeOffTimes}>
                            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                                <lightning-input
                                    name="timeOffStartTime"
                                    label="Start time"
                                    type="time"
                                    value={timeOffStartTime}
                                    onchange={handleTimeOffStartTimeChange}
                                ></lightning-input>
                            </div>
                            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                                <lightning-input
                                    name="timeOffEndTime"
                                    label="End time"
                                    type="time"
                                    value={timeOffEndTime}
                                    onchange={handleTimeOffEndTimeChange}
                                ></lightning-input>
                            </div>
                        </template>
                        <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                            <lightning-input
                                name="timeOffReason"
                                label="Reason"
                                value={timeOffReason}
                                maxlength="255"
                                onchange={handleTimeOffReasonChange}
                            ></lightning-input>
                        </div>
                        <div class="slds-col slds-size_1-of-1">
                            <lightning-input
                                name="thisScheduleOnly"
                                label="This schedule only"
                                type="checkbox"
                                checked={thisScheduleOnly}
                                onchange={handleThisScheduleOnlyChange}
                            ></lightning-input>
                        </div>
                    </div>
                    <div class="slds-m-top_small">
                        <lightning-button
                            label="Apply time off"
                            variant="brand"
                            disabled={isTimeOffDisabled}
                            onclick={handleApplyTimeOff}
                        ></lightning-button>
                    </div>
                    <template lwc:if={hasUnavailabilities}>
                        <ul class="timeoff-list slds-m-top_small">
                            <template for:each={unavailabilityRows} for:item="row">
                                <li key={row.id} class="timeoff-item">
                                    <div>
                                        <div class="slds-text-body_regular">{row.when}</div>
                                        <template lwc:if={row.reason}>
                                            <div class="slds-text-body_small slds-text-color_weak">{row.reason}</div>
                                        </template>
                                    </div>
                                    <lightning-button
                                        label="Remove"
                                        variant="destructive-text"
                                        data-id={row.id}
                                        disabled={isBusy}
                                        onclick={handleRemoveTimeOff}
                                    ></lightning-button>
                                </li>
                            </template>
                        </ul>
                    </template>
                    <template lwc:else>
                        <p class="slds-text-body_small slds-m-top_small slds-text-color_weak">No upcoming time off.</p>
                    </template>
                </template>
                <template lwc:else>
                    <p class="slds-text-body_regular">Save or select a schedule before applying time off.</p>
                </template>
            </section>

            <section class="section section_last">
                <h2 class="slds-text-heading_small slds-m-bottom_small">Slot summary</h2>
                <template lwc:if={hasSelectedSchedule}>
                    <template lwc:if={hasSummary}>
                        <p class="slds-text-body_regular" role="status">{summaryText}</p>
                        <p class="slds-text-body_small slds-text-color_weak slds-m-top_x-small">
                            Use the calendar to paint Free or Blocked time and manage individual slots.
                        </p>
                    </template>
                    <template lwc:else>
                        <p class="slds-text-body_regular">No slots in the planning horizon yet.</p>
                    </template>
                </template>
                <template lwc:else>
                    <p class="slds-text-body_regular">Select a schedule to review its slots.</p>
                </template>
            </section>
        </div>
    </lightning-card>
</template>
